<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:24px;align-items:center;height:110px;padding:20px;box-sizing:border-box;background:var(--bg);font-family:var(--serif);font-style:italic;font-size:32px;color:var(--ink)">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span>|</span><span style="font-family:var(--mono);font-style:normal;font-size:9px;color:var(--inkSoft)">1</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span>|||</span><span style="font-family:var(--mono);font-style:normal;font-size:9px;color:var(--inkSoft)">3</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span>|||<span style="color:var(--accent)">/</span></span><span style="font-family:var(--mono);font-style:normal;font-size:9px;color:var(--inkSoft)">5</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span>9.</span><span style="font-family:var(--mono);font-style:normal;font-size:9px;color:var(--inkSoft)">9+</span></div>
</div>
