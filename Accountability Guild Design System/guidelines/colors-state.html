<!-- @dsCard group="Colors" viewport="700x180" name="State Pairs" subtitle="Error, success, warning, info — each with a soft tint" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);height:180px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase">
<div style="display:grid;grid-template-rows:1fr 1fr"><div style="background:var(--error);color:var(--bg);display:flex;align-items:flex-end;padding:8px">Error</div><div style="background:var(--errorSoft);color:var(--error);display:flex;align-items:flex-end;padding:8px">Error Soft</div></div>
<div style="display:grid;grid-template-rows:1fr 1fr"><div style="background:var(--success);color:var(--bg);display:flex;align-items:flex-end;padding:8px">Success</div><div style="background:var(--successSoft);color:var(--success);display:flex;align-items:flex-end;padding:8px">Success Soft</div></div>
<div style="display:grid;grid-template-rows:1fr 1fr"><div style="background:var(--warning);color:var(--bg);display:flex;align-items:flex-end;padding:8px">Warning</div><div style="background:var(--warningSoft);color:var(--warning);display:flex;align-items:flex-end;padding:8px">Warning Soft</div></div>
<div style="display:grid;grid-template-rows:1fr 1fr"><div style="background:var(--info);color:var(--bg);display:flex;align-items:flex-end;padding:8px">Info</div><div style="background:var(--infoSoft);color:var(--info);display:flex;align-items:flex-end;padding:8px">Info Soft</div></div>
</div>
