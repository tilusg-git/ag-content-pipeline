<!-- @dsCard group="Spacing" viewport="700x150" name="Radius &amp; Hairlines" subtitle="Radius 0 everywhere except icons/avatars/toggles; 1px lines, 2px ink top-rules" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--bg);padding:20px;height:110px;box-sizing:border-box;display:flex;gap:20px;align-items:center">
<div style="width:64px;height:64px;background:var(--panel);border:1px solid var(--ink)"></div>
<div style="width:64px;height:64px;background:var(--accent);border-radius:16px"></div>
<div style="width:56px;height:56px;background:var(--panel);border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;color:var(--ink)">A</div>
<div style="flex:1;border-top:2px solid var(--ink);padding-top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--inkSoft)">2PX INK TOP-RULE</div>
</div>
